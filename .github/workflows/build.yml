name: Build EasyClipper

on:
  push:
    branches: [ "main", "linux_main" ]
  pull_request:
    branches: [ "main", "linux_main" ]
  workflow_dispatch:  # Позволяет запускать вручную

jobs:
  build-linux:
    runs-on: ubuntu-latest

    env:
      PROJECT_PATH: EasyClipper.csproj
      PUBLISH_DIR: EasyClipper/publish

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: 🛠 Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: 📦 Restore dependencies
      run: dotnet restore $PROJECT_PATH

    - name: 🔨 Build
      run: dotnet build $PROJECT_PATH -c Release --no-restore

    # Публикация под Linux x64 (self-contained single file)
    - name: 🚀 Publish (linux-x64, self-contained)
      run: |
        dotnet publish $PROJECT_PATH -c Release -r linux-x64 \
          --self-contained true -p:PublishSingleFile=true \
          -p:EnableCompressionInSingleFile=true -o $PUBLISH_DIR

    - name: 📤 Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: EasyClipper-linux-x64-${{ github.sha }}
        path: ${{ env.PUBLISH_DIR }}
        retention-days: 7
